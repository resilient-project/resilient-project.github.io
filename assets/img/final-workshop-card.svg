  <rect x="400" width="400" height="10" fill="#9dd9a4"/>
  <rect x="800" width="400" height="10" fill="#4f759a"/>

  <g stroke="#e6efd0" stroke-width="24">
    <line x1="870" y1="420" x2="1000" y2="199"/>
    <line x1="1000" y1="199" x2="1130" y2="420"/>
